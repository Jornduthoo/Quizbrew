<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizbrew · Brew a quiz in seconds</title>
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/host.css">
  <link rel="stylesheet" href="/css/rounds.css">
</head>
<body class="host">
  <header class="topbar">
    <img class="logo" src="/img/logo.webp" alt="Quizbrew">
    <span class="quiz-name" id="quiz-name"></span>
    <div class="top-actions">
      <button class="pro-pill" id="pro-btn" type="button" data-ico="star" hidden><span data-i18n="pro.getPro"></span></button>
      <button class="ghost-btn join-btn" id="join-btn" type="button" data-ico="qr" data-i18n-attr="title:host.joinAddress"><span class="join-url" id="join-url"></span></button>
      <a class="ghost-btn" href="/screen" target="quizbrew-screen" data-ico="screen"><span class="lbl" data-i18n="host.openScreen"></span></a>
      <button class="ghost-btn" id="check-btn" type="button" data-ico="check"><span class="lbl" data-i18n="host.check"></span></button>
      <button class="ghost-btn" id="raffle-btn" type="button" data-ico="raffle" data-pro="raffle"><span class="lbl" data-i18n="host.raffle"></span></button>
      <button class="ghost-btn" id="remote-btn" type="button" data-ico="remote"><span class="lbl" data-i18n="host.remote"></span></button>
      <span class="top-sep" aria-hidden="true"></span>
      <a class="ghost-btn icon-btn" href="/network" target="quizbrew-network" data-ico="wifi" data-i18n-attr="title:network.title,aria-label:network.title"></a>
      <button class="ghost-btn icon-btn" id="settings-btn" type="button" data-ico="gear" data-i18n-attr="title:menu.settings,aria-label:menu.settings"></button>
      <button class="ghost-btn icon-btn sfx-btn" id="sfx" type="button" data-i18n-attr="title:host.sfx,aria-label:host.sfx"></button>
    </div>
  </header>

  <!-- The QR code and the address teams type, with every other address of this laptop. -->
  <dialog class="modal join-modal" id="join-modal">
    <header class="modal-head">
      <h2 data-i18n="menu.joinTitle"></h2>
      <button class="mini close" type="button" data-close data-i18n-attr="aria-label:builder.close"></button>
    </header>
    <div class="join-body">
      <div class="join-qr" id="join-qr"></div>
      <p class="join-big" id="join-big"></p>
      <div class="join-others" id="join-others" hidden>
        <p class="hint" data-i18n="menu.joinOthers"></p>
        <ul class="addr-list" id="join-list"></ul>
      </div>
      <a class="help-link" href="/network" target="quizbrew-network" data-ico="wifi"><span data-i18n="network.title"></span></a>
    </div>
  </dialog>

  <!-- Settings: language, look and how to play; on the laptop also the venue and the network. -->
  <dialog class="modal settings-modal" id="settings-modal">
    <header class="modal-head">
      <h2 data-ico="gear"><span data-i18n="menu.settings"></span></h2>
      <button class="mini close" type="button" data-close data-i18n-attr="aria-label:builder.close"></button>
    </header>
    <div class="settings-body">
      <label class="set-row lang">
        <span class="set-name" data-i18n="host.language"></span>
        <select id="lang"></select>
      </label>
      <label class="set-row lang look-pick">
        <span class="set-name" data-i18n="host.look"></span>
        <select id="look"></select>
      </label>
      <label class="set-row lang mode-pick">
        <span class="set-name" data-i18n="host.mode"></span>
        <select id="mode"></select>
      </label>
      <div class="set-row" id="settings-pro-row">
        <span class="set-name"><span data-i18n="pro.licence"></span> <span class="hint" id="settings-pro-state"></span></span>
        <button class="ghost-btn small" id="settings-pro" type="button" data-i18n="pro.title"></button>
      </div>
      <div class="set-row" id="settings-venue-row">
        <span class="set-name" data-i18n="venue.title"></span>
        <button class="ghost-btn small" id="settings-venue" type="button" data-pro="venue" data-i18n="menu.venueEdit"></button>
      </div>
      <div class="set-row" id="samples-restore-row" hidden>
        <span class="set-name"><span data-i18n="manage.samplesTitle"></span> <span class="hint" id="samples-restore-count"></span></span>
        <button class="ghost-btn small" id="samples-restore" type="button" data-i18n="manage.restoreSamples"></button>
      </div>
      <section class="set-net" id="settings-net">
        <h3 data-ico="wifi"><span data-i18n="menu.network"></span></h3>
        <p class="hint" data-i18n="menu.networkHint"></p>
        <div class="set-actions">
          <button class="ghost-btn small" id="settings-fw" type="button" data-ico="shield"><span data-i18n="network.fwButton"></span></button>
          <a class="ghost-btn small" href="/network" target="quizbrew-network" data-ico="wifi"><span data-i18n="network.title"></span></a>
        </div>
        <p class="error" id="settings-fw-error" role="alert"></p>
      </section>
    </div>
  </dialog>

  <!-- The remote: scan with the quizmaster's phone or tablet -->
  <div class="remote-pop panel" id="remote-pop" hidden>
    <div class="qr-mini" id="remote-qr"></div>
    <div>
      <h3 data-i18n="host.remoteTitle"></h3>
      <p class="hint" data-i18n="host.remoteHint"></p>
      <p class="remote-url" id="remote-url"></p>
    </div>
  </div>

  <!-- Connection test: scan with any phone before the guests arrive -->
  <div class="remote-pop check-pop panel" id="check-pop" hidden>
    <div class="qr-mini" id="check-qr"></div>
    <div class="check-body">
      <h3 data-i18n="host.checkTitle"></h3>
      <p class="hint" data-i18n="host.checkHint"></p>
      <p class="check-status" id="check-status" data-i18n="host.checkWaiting"></p>
      <ul class="check-hits" id="check-hits"></ul>
      <details class="check-tips" id="check-tips">
        <summary data-i18n="host.checkTipsTitle"></summary>
        <ol>
          <li data-i18n="host.checkTip1"></li>
          <li data-i18n="host.checkTip2"></li>
          <li data-i18n="host.checkTip3"></li>
          <li data-i18n="host.checkTip4"></li>
        </ol>
        <a class="help-link" href="/network" target="quizbrew-network" data-ico="wifi"><span data-i18n="network.title"></span></a>
        <p class="remote-url" id="check-addr"></p>
      </details>
    </div>
  </div>

  <!-- Raffle: draw a team or a ticket number on the big screen -->
  <div class="remote-pop raffle-pop panel" id="raffle-pop" hidden>
    <div class="raffle-body">
      <h3 data-i18n="host.raffleTitle"></h3>
      <div class="seg" id="raffle-mode">
        <button type="button" class="on" data-mode="teams" data-i18n="host.raffleTeams"></button>
        <button type="button" data-mode="tickets" data-i18n="host.raffleTickets"></button>
      </div>
      <div class="raffle-range" id="raffle-range" hidden>
        <label><span data-i18n="host.raffleFrom"></span> <input type="number" id="raffle-from" value="1" min="1" inputmode="numeric"></label>
        <label><span data-i18n="host.raffleTo"></span> <input type="number" id="raffle-to" value="100" min="1" inputmode="numeric"></label>
      </div>
      <div class="raffle-actions">
        <button class="brass-btn" id="raffle-draw" type="button" data-i18n="host.raffleDraw"></button>
        <button class="ghost-btn" id="raffle-hide" type="button" data-i18n="host.raffleHide"></button>
      </div>
      <p class="error" id="raffle-error" role="alert"></p>
      <ol class="raffle-winners" id="raffle-winners"></ol>
      <button class="ghost-btn small" id="raffle-reset" type="button" data-i18n="host.raffleReset" hidden></button>
    </div>
  </div>

  <!-- Pick a quiz -->
  <main id="v-idle" class="view library" hidden>
    <!-- A quiz that was running when Quizbrew stopped: pick it up again. -->
    <section class="resume panel" id="resume" hidden>
      <div>
        <p class="label" data-i18n="host.resumeKicker"></p>
        <h2 class="resume-title" id="resume-title"></h2>
        <p class="hint" id="resume-meta"></p>
      </div>
      <div class="card-actions">
        <button class="brass-btn" id="resume-go" type="button" data-i18n="host.resume"></button>
        <button class="ghost-btn" id="resume-no" type="button" data-i18n="host.resumeNo"></button>
      </div>
    </section>
    <div class="hero">
      <img class="hero-logo" src="/img/logo.webp" alt="Quizbrew">
      <p class="hero-slogan" data-i18n="host.tagline"></p>
      <p class="hero-tag" data-i18n="host.network"></p>
    </div>
    <div class="tiles">
      <a class="tile" href="/builder">
        <img src="/img/icons/builder.webp" alt="">
        <strong data-i18n="builder.title"></strong>
        <span data-i18n="host.builderHint"></span>
        <em data-i18n="host.tagBuild"></em>
      </a>
      <a class="tile" href="/screen" target="quizbrew-screen">
        <img src="/img/icons/screen.webp" alt="">
        <strong data-i18n="host.openScreen"></strong>
        <span data-i18n="host.screenHint"></span>
        <em data-i18n="host.tagScreen"></em>
      </a>
      <button class="tile" type="button" id="remote-tile">
        <img src="/img/icons/remote.webp" alt="">
        <strong data-i18n="host.remote"></strong>
        <span data-i18n="host.remoteTileHint"></span>
        <em data-i18n="host.tagRemote"></em>
      </button>
      <button class="tile" type="button" id="venue-tile" data-pro="venue">
        <img src="/img/icons/special.webp" alt="">
        <strong data-i18n="venue.title"></strong>
        <span data-i18n="venue.tileHint"></span>
        <em data-i18n="venue.tag"></em>
      </button>
    </div>
    <h1 class="section-title" data-i18n="host.pickQuiz"></h1>
    <div class="quiz-tools">
      <p class="hint" data-i18n="host.pickQuizHint"></p>
      <input class="quiz-search" id="quiz-search" type="search" autocomplete="off" data-i18n-attr="placeholder:manage.search" hidden>
    </div>
    <ul class="quiz-list" id="quiz-list"></ul>
  </main>

  <!-- Running a quiz -->
  <main id="v-live" class="view live" hidden>
    <section class="stage panel">
      <p class="phase-kicker" id="phase-kicker"></p>
      <h1 class="phase-title" id="phase-title"></h1>
      <p class="coach" id="coach"></p>
      <div class="preview" id="preview"></div>
      <!-- Phones-only mode: what the phones show, with the sound for the room. -->
      <div class="screen-copy" id="screen-copy" hidden>
        <iframe id="screen-copy-frame" title="Quizbrew" allow="autoplay"></iframe>
      </div>
      <div class="controls">
        <button class="brass-btn next" id="next"></button>
        <button class="ghost-btn" id="add-time" type="button" data-i18n="host.addTime" hidden></button>
        <button class="ghost-btn" id="back" type="button" data-i18n="host.back" hidden></button>
        <button class="ghost-btn" id="break" type="button" hidden></button>
        <button class="ghost-btn autopilot-btn" id="autopilot" data-pro="autopilot" type="button" aria-pressed="false" data-i18n-attr="title:host.autopilotHint,aria-label:host.autopilot"><span class="auto-dot"></span><span data-i18n="host.autopilot"></span></button>
        <span class="key-hint" data-i18n="host.keyHint"></span>
        <button class="ghost-btn danger" id="stop" data-i18n="host.stop"></button>
      </div>
    </section>
    <aside class="teams panel">
      <h2><span data-i18n="host.teams"></span> <span class="count" id="team-total"></span></h2>
      <ul id="team-list"></ul>
      <p class="hint" id="no-teams" data-i18n="host.noTeams"></p>
      <!-- Teams without a phone play on paper; their points per round are typed in here. -->
      <div class="paper-box">
        <form class="paper-form" id="paper-form" autocomplete="off">
          <input id="paper-name" maxlength="20" data-i18n-attr="placeholder:host.paperName,aria-label:host.paperName">
          <button class="ghost-btn small" type="submit" data-i18n="host.paperAdd"></button>
        </form>
        <p class="error" id="paper-error" role="alert"></p>
        <p class="hint paper-hint" id="paper-hint" hidden data-i18n="host.paperHint"></p>
        <a class="ghost-btn small" id="paper-sheet" data-pro="print" href="/print?live=1&amp;mode=answers" target="_blank" data-i18n="host.paperSheet"></a>
      </div>
    </aside>
  </main>

  <!-- The quizmaster's call: give or take points for one team -->
  <dialog class="modal score-modal" id="score-modal">
    <header class="modal-head">
      <h2 id="score-title"></h2>
      <button class="mini close" type="button" data-close data-i18n-attr="aria-label:builder.close"></button>
    </header>
    <form class="score-body" id="score-form" autocomplete="off">
      <p class="score-now" id="score-now"></p>
      <div class="score-steps" id="score-steps"></div>
      <div class="score-own">
        <input id="score-amount" type="number" inputmode="numeric" step="1" min="-1000" max="1000" data-i18n-attr="placeholder:host.scoreOther,aria-label:host.scoreOther">
        <button class="brass-btn" type="submit" data-i18n="host.scoreGive"></button>
      </div>
      <p class="hint" data-i18n="host.scoreHint"></p>
    </form>
  </dialog>

  <!-- The venue and its sponsors: on the big screen and the phones -->
  <dialog class="modal venue-modal" id="venue-modal">
    <header class="modal-head">
      <h2 data-i18n="venue.title"></h2>
      <button class="mini close" type="button" data-close data-i18n-attr="aria-label:builder.close"></button>
    </header>
    <form class="venue-form" id="venue-form">
      <p class="hint" data-i18n="venue.intro"></p>
      <div class="venue-row">
        <div class="logo-slot" id="venue-logo"></div>
        <label class="field"><span data-i18n="venue.name"></span><input id="venue-name" maxlength="60" data-i18n-attr="placeholder:venue.namePh"></label>
      </div>
      <h3 data-i18n="venue.sponsors"></h3>
      <p class="hint" data-i18n="venue.sponsorsHint"></p>
      <ul class="sponsor-list" id="sponsor-list"></ul>
      <button type="button" class="ghost-btn small" id="sponsor-add" data-i18n="venue.addSponsor"></button>
      <p class="error" id="venue-error" role="alert"></p>
      <div class="venue-actions">
        <button class="brass-btn" type="submit" data-i18n="venue.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Quizbrew Pro: what it unlocks, the price, and a field for a code. Works offline. -->
  <dialog class="modal pro-modal" id="pro-modal">
    <header class="modal-head">
      <h2 data-ico="star"><span data-i18n="pro.title"></span></h2>
      <button class="mini close" type="button" data-close data-i18n-attr="aria-label:builder.close"></button>
    </header>
    <div class="pro-body">
      <p class="pro-state" id="pro-state"></p>
      <div class="pro-sell" id="pro-sell">
        <p class="pro-tag neon" data-i18n="pro.tagline"></p>
        <ul class="pro-list" id="pro-list"></ul>
        <p class="pro-price" id="pro-price"></p>
        <a class="brass-btn pro-buy" id="pro-buy" href="https://quizbrew.app" target="_blank" rel="noopener" data-i18n="pro.buy"></a>
      </div>
      <form class="pro-code" id="pro-form" autocomplete="off">
        <label class="field"><span data-i18n="pro.haveCode"></span>
          <textarea id="pro-input" rows="2" spellcheck="false" data-i18n-attr="placeholder:pro.codePh,aria-label:pro.haveCode"></textarea></label>
        <button class="brass-btn" type="submit" data-i18n="pro.activate"></button>
        <p class="error" id="pro-error" role="alert"></p>
      </form>
      <button class="link-btn pro-remove" id="pro-remove" type="button" data-i18n="pro.remove" hidden></button>
    </div>
  </dialog>

  <div id="alerts" class="alerts" aria-live="assertive"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
