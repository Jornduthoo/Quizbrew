<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0805">
  <title>Quizbrew · Brew a quiz in seconds</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/play.css">
  <link rel="stylesheet" href="/css/rounds.css">
</head>
<body class="phone">
  <div class="glow-bg" aria-hidden="true"><i></i><i></i></div>
  <!-- Phones-only mode: a small copy of the big screen. Tap it to see it full size. -->
  <div class="stage-box" id="stage" hidden>
    <iframe id="stage-frame" title="Quizbrew" tabindex="-1"></iframe>
    <button class="stage-tap" id="stage-tap" type="button" data-i18n-attr="aria-label:play.bigger"></button>
    <button class="stage-close" id="stage-close" type="button" data-i18n-attr="aria-label:builder.close"></button>
  </div>
  <!-- Join: team name + colour -->
  <section id="v-join" class="view" hidden>
    <img class="logo" src="/img/logo.webp" alt="Quizbrew">
    <div class="venue-badge" id="join-venue" hidden><img id="join-venue-logo" alt=""><span id="join-venue-name"></span></div>
    <form id="join-form" class="card panel" autocomplete="off">
      <label class="label" for="team-name" data-i18n="play.teamName"></label>
      <input id="team-name" maxlength="20" required data-i18n-attr="placeholder:play.teamNamePlaceholder" enterkeyhint="done">
      <p class="label" data-i18n="play.pickColor"></p>
      <div class="swatches" id="swatches"></div>
      <label class="team-photo" id="tp-label">
        <input type="file" id="tp-input" accept="image/*" capture="user" hidden>
        <span class="tp-face" id="tp-face"></span>
        <span class="tp-text" data-i18n="play.teamPhoto"></span>
      </label>
      <p class="error" id="join-error" role="alert"></p>
      <button class="brass-btn big" type="submit" data-i18n="play.join"></button>
    </form>
    <div class="card panel join-team" id="join-team" hidden>
      <p class="label" data-i18n="play.joinTeam"></p>
      <p class="hint" data-i18n="play.joinTeamHint"></p>
      <div class="team-pick" id="team-pick"></div>
      <p class="error" id="pick-error" role="alert"></p>
    </div>
    <!-- No team? Play along in the audience with a nickname. -->
    <button class="link-btn aud-open" id="aud-open" type="button" data-i18n="play.audience.open"></button>
    <form class="card panel aud-join" id="aud-form" autocomplete="off" hidden>
      <p class="label" data-i18n="play.audience.title"></p>
      <p class="hint" data-i18n="play.audience.hint"></p>
      <input id="aud-input" maxlength="20" required data-i18n-attr="placeholder:play.audience.nickname,aria-label:play.audience.nickname" enterkeyhint="done">
      <p class="error" id="aud-error" role="alert"></p>
      <button class="brass-btn big" type="submit" data-i18n="play.audience.join"></button>
    </form>
  </section>

  <!-- The audience: answer along, own score, never counts for the teams -->
  <section id="v-audience" class="view audience-view" hidden>
    <div class="aud-head"><span class="aud-badge" data-i18n="play.audience.badge"></span><span class="aud-name" id="aud-name"></span><span class="aud-score" id="aud-score"></span></div>
    <p class="phone-q aud-q" id="aud-q" hidden></p>
    <div class="choices" id="aud-choices"></div>
    <p class="say aud-say" id="aud-say" aria-live="polite"></p>
    <ol class="standings" id="aud-top" hidden></ol>
    <button class="link-btn aud-leave" id="aud-leave" type="button" data-i18n="play.audience.leave"></button>
  </section>

  <!-- No quiz loaded yet -->
  <section id="v-idle" class="view center" hidden>
    <img class="logo" src="/img/logo.webp" alt="Quizbrew">
    <p class="say" data-i18n="play.noQuiz"></p>
  </section>

  <!-- Waiting: look at the big screen -->
  <section id="v-wait" class="view center" hidden>
    <div class="badge" id="wait-badge"></div>
    <p class="say" id="wait-text" aria-live="polite"></p>
    <p class="quip" id="wait-quip"></p>
    <button class="ghost-btn photo-later" id="photo-later" type="button" hidden data-i18n="play.teamPhotoLater"></button>
    <ol class="standings" id="standings" hidden></ol>
    <!-- End of the quiz: stars for the quiz and a picture of the result to share. -->
    <div class="end-extras" id="end-extras" hidden>
      <p class="label" data-i18n="play.rateQuiz"></p>
      <div class="stars" id="stars"></div>
      <button class="brass-btn big share-btn" id="share-btn" type="button" data-i18n="play.share"></button>
    </div>
    <p class="made-with" id="made-with" hidden><span data-i18n="brand.madeWith"></span><img src="/img/logo.webp" alt="Quizbrew" width="1037" height="467"><span class="made-own" data-i18n="brand.yourOwn"></span><a class="made-url" href="https://quizbrew.app" target="_blank" rel="noopener" data-i18n="brand.site"></a></p>
    <button class="brass-btn big joker-btn" id="joker-btn" type="button" hidden data-i18n="play.playJoker"></button>
    <button class="ghost-btn power-btn shield" id="shield-btn" type="button" hidden><span class="p-icon" aria-hidden="true"></span><span data-i18n="play.power.shield"></span></button>
    <p class="power-left" id="power-left" hidden></p>
  </section>

  <!-- Answer buttons -->
  <section id="v-question" class="view answer-view" hidden>
    <div class="mini-head"><span id="q-num"></span><span class="q-extra" id="q-extra"></span><span id="q-time"></span></div>
    <p class="phone-q" id="phone-q" hidden></p>
    <div class="choices" id="choices"></div>
    <button class="brass-btn big bank-btn" id="bank-btn" type="button" hidden></button>
    <button class="ghost-btn lifeline-btn" id="lifeline-btn" type="button" hidden data-i18n="play.lifeline"></button>
    <div class="powers" id="powers" hidden>
      <button class="ghost-btn power-btn spy" id="spy-btn" type="button" hidden><span class="p-icon" aria-hidden="true"></span><span data-i18n="play.power.spy"></span></button>
      <button class="ghost-btn power-btn fifty" id="fifty-btn" type="button" hidden><span class="p-icon" aria-hidden="true"></span><span data-i18n="play.power.fifty"></span></button>
    </div>
  </section>

  <!-- Clock rounds: one team answers out loud while its clock runs -->
  <section id="v-turn" class="view center" hidden>
    <p class="label" id="turn-label"></p>
    <div class="turn-clock" id="turn-clock"><span id="turn-num"></span></div>
    <p class="sub" id="turn-sub"></p>
  </section>

  <!-- Type an answer (open, scramble, clues, closest number) -->
  <section id="v-type" class="view answer-view" hidden>
    <div class="mini-head"><span id="t-num"></span><span id="t-time"></span></div>
    <form id="type-form" class="card panel type-card" autocomplete="off">
      <label class="label" for="type-input" id="type-label"></label>
      <div class="type-row"><input id="type-input" maxlength="80" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false"><span class="unit" id="type-unit"></span></div>
      <button class="brass-btn big" type="submit" data-i18n="play.send"></button>
    </form>
  </section>

  <!-- Put in order, make pairs, or drop a pin on a picture -->
  <section id="v-build" class="view answer-view" hidden>
    <div class="mini-head"><span id="b-num"></span><span id="b-time"></span></div>
    <p class="label build-label" id="build-label"></p>
    <div class="build" id="build"></div>
    <div class="build-actions">
      <button class="ghost-btn" id="build-undo" type="button" data-i18n="play.undo"></button>
      <button class="brass-btn big" id="build-send" type="button" data-i18n="play.send" disabled></button>
    </div>
  </section>

  <!-- Buzzer: one big button -->
  <section id="v-buzz" class="view center" hidden>
    <div class="mini-head wide"><span id="z-num"></span><span id="z-time"></span></div>
    <button class="buzz-btn" id="buzz-btn" type="button"><span data-i18n="play.buzz"></span></button>
    <p class="say" id="buzz-text" aria-live="polite"></p>
  </section>

  <!-- List rush: type as many as you can -->
  <section id="v-list" class="view answer-view" hidden>
    <div class="mini-head"><span id="l-num"></span><span class="q-extra" id="l-count"></span><span id="l-time"></span></div>
    <form id="list-form" class="type-row list-row" autocomplete="off">
      <input id="list-input" maxlength="60" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-attr="placeholder:play.typeItems">
      <button class="brass-btn" type="submit" data-i18n="play.add"></button>
    </form>
    <ul class="list-sent" id="list-sent"></ul>
  </section>

  <!-- Draw on the phone -->
  <section id="v-draw" class="view answer-view" hidden>
    <div class="mini-head"><span id="d-num"></span><span id="d-time"></span></div>
    <div class="draw-wrap"><canvas class="draw-canvas" id="draw-canvas"></canvas></div>
    <div class="draw-tools" id="draw-tools"></div>
    <div class="build-actions">
      <button class="ghost-btn" id="draw-undo" type="button" data-i18n="play.undo"></button>
      <button class="ghost-btn" id="draw-clear" type="button" data-i18n="play.clear"></button>
      <button class="brass-btn big" id="draw-send" type="button" data-i18n="play.send"></button>
    </div>
  </section>

  <!-- Take a photo -->
  <section id="v-photo" class="view center" hidden>
    <div class="mini-head wide"><span id="p-num"></span><span id="p-time"></span></div>
    <label class="photo-shot"><input type="file" id="photo-input" accept="image/*" capture="environment" hidden><img id="photo-preview" alt="" hidden><span id="photo-label" data-i18n="play.takePhoto"></span></label>
    <button class="brass-btn big" id="photo-send" type="button" data-i18n="play.send" disabled></button>
  </section>

  <!-- Act it out: only the acting team sees the secret -->
  <section id="v-actor" class="view center" hidden>
    <p class="label" data-i18n="play.actKicker"></p>
    <p class="secret" id="actor-secret"></p>
    <p class="sub" data-i18n="play.actHint"></p>
  </section>

  <!-- Vote on what the other teams made -->
  <section id="v-vote" class="view answer-view" hidden>
    <div class="mini-head"><span id="v-label"></span><span id="v-time"></span></div>
    <div class="ballot" id="ballot"></div>
    <button class="brass-btn big" id="match-send" type="button" data-i18n="play.send" hidden></button>
  </section>

  <!-- Bet points before the question (jackpot) -->
  <section id="v-wager" class="view center" hidden>
    <p class="label" id="wager-kicker"></p>
    <p class="say big" id="wager-category"></p>
    <div class="bet-box" id="bet-box">
      <output class="wager-amount" id="wager-amount"></output>
      <input class="wager-range" type="range" id="wager-range" min="0" step="1" data-i18n-attr="aria-label:play.wagerKicker">
      <button class="brass-btn big" id="wager-send" type="button" data-i18n="play.placeBet"></button>
    </div>
    <div class="level-picks" id="level-picks" hidden></div>
    <div class="level-picks pick-list" id="pick-list" hidden></div>
    <p class="sub" id="wager-note"></p>
  </section>

  <!-- Result after the reveal -->
  <section id="v-reveal" class="view center" hidden>
    <div class="result-wrap"><div class="rays" aria-hidden="true"></div><div class="result" id="result-icon"></div></div>
    <p class="say big" id="result-text" aria-live="polite"></p>
    <p class="sub" id="result-sub"></p>
    <p class="quip" id="result-quip"></p>
    <p class="fact" id="result-fact" hidden></p>
  </section>

  <!-- The result card: hold it to save or share it (sharing straight away needs a secure page, so it is a bonus). -->
  <div class="share-sheet" id="share-sheet" hidden>
    <img id="share-img" alt="">
    <p class="hint" data-i18n="play.shareHint"></p>
    <div class="build-actions">
      <button class="brass-btn big" id="share-native" type="button" data-i18n="play.shareNow" hidden></button>
      <a class="ghost-btn" id="share-save" download="quizbrew.png" data-i18n="play.shareSave"></a>
      <button class="ghost-btn" id="share-close" type="button" data-i18n="builder.close"></button>
    </div>
  </div>

  <div class="react-bar" id="react-bar" role="group" hidden data-i18n-attr="aria-label:play.react"></div>
  <div class="team-bar" id="team-bar" hidden><span class="team-dot" id="bar-dot"></span><span id="bar-name"></span><span class="bar-score" id="bar-score"></span><button class="text-size" id="text-size" type="button" aria-pressed="false" data-i18n-attr="aria-label:play.bigText,title:play.bigText"></button></div>
  <div class="offline" id="offline" hidden data-i18n="play.reconnecting"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
