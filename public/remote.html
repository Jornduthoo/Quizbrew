<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizbrew remote</title>
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/host.css">
  <link rel="stylesheet" href="/css/rounds.css">
</head>
<body class="host remote">
  <header class="topbar">
    <img class="logo" src="/img/logo.webp" alt="Quizbrew">
    <span class="quiz-name" id="quiz-name"></span>
    <div class="top-actions">
      <span class="join-url" id="join-url" hidden></span>
<button class="ghost-btn sfx-btn" id="sfx" type="button" data-i18n-attr="title:host.sfx"></button>
      <label class="lang mode-pick">
        <span class="sr" data-i18n="host.mode"></span>
        <select id="mode"></select>
      </label>
      <label class="lang look-pick">
        <span class="sr" data-i18n="host.look"></span>
        <select id="look"></select>
      </label>
      <label class="lang">
        <span class="sr" data-i18n="host.language"></span>
        <select id="lang"></select>
      </label>
    </div>
  </header>

  <!-- Pick a quiz -->
  <main id="v-idle" class="view library" hidden>
    <!-- A quiz that was running when Quizbrew stopped: pick it up again. -->
    <section class="resume panel" id="resume" hidden>
      <div>
        <p class="label" data-i18n="host.resumeKicker"></p>
        <h2 class="resume-title" id="resume-title"></h2>
        <p class="hint" id="resume-meta"></p>
      </div>
      <div class="card-actions">
        <button class="brass-btn" id="resume-go" type="button" data-i18n="host.resume"></button>
        <button class="ghost-btn" id="resume-no" type="button" data-i18n="host.resumeNo"></button>
      </div>
    </section>
<div class="hero">
      <img class="hero-logo" src="/img/logo.webp" alt="Quizbrew">
      <p class="hero-slogan" data-i18n="host.tagline"></p>
      <p class="hero-tag" data-i18n="host.network"></p>
    </div>
    <h1 class="section-title" data-i18n="host.pickQuiz"></h1>
    <p class="hint" data-i18n="host.pickQuizHint"></p>
    <ul class="quiz-list" id="quiz-list"></ul>
  </main>

  <!-- Running a quiz -->
  <main id="v-live" class="view live" hidden>
    <section class="stage panel">
      <p class="phase-kicker" id="phase-kicker"></p>
      <h1 class="phase-title" id="phase-title"></h1>
      <p class="coach" id="coach"></p>
      <div class="preview" id="preview"></div>
      <div class="controls">
        <button class="brass-btn next" id="next"></button>
        <button class="ghost-btn" id="add-time" type="button" data-i18n="host.addTime" hidden></button>
        <button class="ghost-btn" id="back" type="button" data-i18n="host.back" hidden></button>
        <button class="ghost-btn" id="break" type="button" hidden></button>
        <button class="ghost-btn autopilot-btn" id="autopilot" type="button" aria-pressed="false" data-i18n-attr="title:host.autopilotHint,aria-label:host.autopilot"><span class="auto-dot"></span><span data-i18n="host.autopilot"></span></button>
        <span class="key-hint" data-i18n="host.keyHint"></span>
        <button class="ghost-btn danger" id="stop" data-i18n="host.stop"></button>
      </div>
    </section>
    <aside class="teams panel">
      <h2><span data-i18n="host.teams"></span> <span class="count" id="team-total"></span></h2>
      <ul id="team-list"></ul>
      <p class="hint" id="no-teams" data-i18n="host.noTeams"></p>
      <!-- Teams without a phone play on paper; their points per round are typed in here. -->
      <div class="paper-box">
        <form class="paper-form" id="paper-form" autocomplete="off">
          <input id="paper-name" maxlength="20" data-i18n-attr="placeholder:host.paperName,aria-label:host.paperName">
          <button class="ghost-btn small" type="submit" data-i18n="host.paperAdd"></button>
        </form>
        <p class="error" id="paper-error" role="alert"></p>
        <p class="hint paper-hint" id="paper-hint" hidden data-i18n="host.paperHint"></p>
      </div>
    </aside>
  </main>

  <div class="remote-offline" id="remote-offline" role="status" hidden></div>
  <div id="alerts" class="alerts" aria-live="assertive"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/host.js"></script>
  <script src="/js/awake.js"></script>
</body>
</html>
