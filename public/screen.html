<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizbrew · Brew a quiz in seconds</title>
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/screen.css">
  <link rel="stylesheet" href="/css/rounds.css">
</head>
<body class="screen">
  <!-- Backgrounds per phase; they cross-fade and drift slowly. -->
  <div class="bg bg-lobby"></div>
  <div class="bg bg-stage"></div>
  <div class="bg bg-play"></div>
  <div class="bg bg-board"></div>
  <div class="bg bg-finale"></div>
  <div class="beams" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>

  <!-- Waiting for the quizmaster to pick a quiz -->
  <section id="v-idle" class="view center">
    <img class="logo big flicker" src="/img/logo.webp" alt="Quizbrew">
    <p class="tagline" data-i18n="screen.idle"></p>
  </section>

  <!-- Lobby: QR + teams coming in -->
  <section id="v-lobby" class="view lobby" hidden>
    <div class="lobby-left">
      <img class="logo" src="/img/logo.webp" alt="Quizbrew">
      <h1 class="quiz-title" id="lobby-title"></h1>
      <div class="qr-card">
        <div class="qr" id="qr"></div>
        <div class="qr-text">
          <svg class="scan-arrow" viewBox="0 0 60 24" aria-hidden="true"><path d="M58 12H6M16 2L4 12l12 10"/></svg>
          <p class="scan neon" data-i18n="screen.scan"></p>
          <p class="or" data-i18n="screen.orGoTo"></p>
          <p class="url" id="join-url"></p>
        </div>
      </div>
      <p class="lobby-quip" id="lobby-quip"></p>
    </div>
    <div class="lobby-right panel">
      <h2 class="teams-head"><span id="team-count"></span></h2>
      <ul class="team-grid" id="lobby-teams"></ul>
      <p class="empty" id="lobby-empty" data-i18n="screen.waitingTeams"></p>
    </div>
  </section>

  <!-- Round intro -->
  <section id="v-roundIntro" class="view center round-intro" hidden>
    <div class="ri-medal" id="ri-medal"><img class="ri-art" id="ri-art" alt=""></div>
    <p class="round-kicker" id="round-kicker"></p>
    <h1 class="round-title neon" id="round-title"></h1>
    <p class="ri-type"><svg class="ri-icon" id="ri-icon" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="ri-type"></span></p>
    <p class="round-meta" id="round-meta"></p>
  </section>

  <!-- Question + reveal -->
  <section id="v-question" class="view question" hidden>
    <header class="q-head">
      <span class="q-count" id="q-count"></span>
      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="ring" id="timer-ring" cx="50" cy="50" r="44"/></svg>
        <span id="timer-num"></span>
      </div>
      <span class="q-answered" id="q-answered"></span>
    </header>
    <div class="q-body">
      <div class="q-media" id="q-media" hidden><img id="q-img" alt=""><canvas id="q-canvas" hidden></canvas><video id="q-video" playsinline preload="auto" hidden></video><div class="pins" id="q-pins"></div><div class="sound-wave" id="q-wave" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="q-main">
        <p class="q-category" id="q-category" hidden></p>
        <div class="q-board"><h1 id="q-text"></h1></div>
        <div class="emoji-row" id="q-emoji" hidden></div>
        <div class="tiles" id="q-tiles" hidden></div>
        <ol class="order-list" id="q-items" hidden></ol>
        <div class="pair-cols" id="q-pairs" hidden></div>
        <ol class="clues" id="q-clues" hidden></ol>
        <ol class="level-cards" id="q-levels" hidden></ol>
        <ul class="list-board" id="q-list" hidden></ul>
        <p class="type-hint" id="q-typehint" hidden></p>
        <div class="q-solution" id="q-solution" hidden></div>
      </div>
    </div>
    <ol class="answers" id="answers"></ol>
    <ul class="team-answers" id="team-answers" hidden></ul>
    <ul class="round-board" id="round-board" hidden></ul>
    <ol class="clock-board" id="clock-board" hidden></ol>
    <ul class="answered-dots" id="answered-dots"></ul>
    <div class="buzz-banner" id="buzz-banner" hidden></div>
  </section>

  <!-- Party rounds: vote on what the teams made, then see who made what -->
  <section id="v-vote" class="view vote" hidden>
    <header class="q-head">
      <span class="q-count" id="vote-kicker"></span>
      <div class="timer small-timer"><span id="vote-time"></span></div>
      <span class="q-answered" id="vote-count"></span>
    </header>
    <h1 class="vote-q" id="vote-q"></h1>
    <ol class="ballot-grid" id="ballot-grid"></ol>
  </section>

  <!-- Bets before a jackpot question -->
  <section id="v-wager" class="view center wager" hidden>
    <p class="round-kicker" id="wager-kicker"></p>
    <h1 class="neon wager-category" id="wager-category"></h1>
    <ol class="pick-cards" id="pick-cards" hidden></ol>
    <p class="round-meta" id="wager-hint"></p>
    <ul class="answered-dots big" id="wager-dots"></ul>
  </section>

  <!-- Scoreboard -->
  <section id="v-scoreboard" class="view scoreboard" hidden>
    <h1 class="neon pink sb-title" id="sb-title"></h1>
    <p class="sb-quip" id="sb-quip"></p>
    <ol class="sb-list" id="sb-list"></ol>
  </section>

  <!-- End: podium -->
  <section id="v-end" class="view end" hidden>
    <h1 class="neon end-title" id="end-title"></h1>
    <div class="podium" id="podium"></div>
    <ol class="rest" id="rest"></ol>
    <p class="end-quip" id="end-quip"></p>
    <p class="made-with"><span data-i18n="brand.madeWith"></span><img src="/img/logo.webp" alt="Quizbrew" width="720" height="326"><span class="made-own" data-i18n="brand.yourOwn"></span></p>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/common.js"></script>
  <button class="sound-gate" id="sound-gate" hidden data-i18n="screen.enableSound"></button>
  <script src="/js/media.js"></script>
  <script src="/js/screen.js"></script>
</body>
</html>
