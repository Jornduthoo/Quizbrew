<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizbrew</title>
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/screen.css">
</head>
<body class="screen">
  <div class="backdrop"></div>
  <div class="vignette"></div>

  <!-- Waiting for the quizmaster to pick a quiz -->
  <section id="v-idle" class="view center">
    <img class="logo big flicker" src="/img/logo.webp" alt="Quizbrew">
    <p class="tagline" data-i18n="screen.idle"></p>
  </section>

  <!-- Lobby: QR + teams coming in -->
  <section id="v-lobby" class="view lobby" hidden>
    <div class="lobby-left">
      <img class="logo" src="/img/logo.webp" alt="Quizbrew">
      <h1 class="quiz-title" id="lobby-title"></h1>
      <div class="qr-card">
        <div class="qr" id="qr"></div>
        <div class="qr-text">
          <p class="scan neon" data-i18n="screen.scan"></p>
          <p class="or" data-i18n="screen.orGoTo"></p>
          <p class="url" id="join-url"></p>
        </div>
      </div>
    </div>
    <div class="lobby-right panel">
      <h2 class="teams-head"><span id="team-count"></span></h2>
      <ul class="team-grid" id="lobby-teams"></ul>
      <p class="empty" id="lobby-empty" data-i18n="screen.waitingTeams"></p>
    </div>
  </section>

  <!-- Round intro -->
  <section id="v-roundIntro" class="view center" hidden>
    <p class="round-kicker" id="round-kicker"></p>
    <h1 class="round-title neon" id="round-title"></h1>
    <p class="round-meta" id="round-meta"></p>
  </section>

  <!-- Question + reveal -->
  <section id="v-question" class="view question" hidden>
    <header class="q-head">
      <span class="q-count" id="q-count"></span>
      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="ring" id="timer-ring" cx="50" cy="50" r="44"/></svg>
        <span id="timer-num"></span>
      </div>
      <span class="q-answered" id="q-answered"></span>
    </header>
    <div class="q-board"><h1 id="q-text"></h1></div>
    <ol class="answers" id="answers"></ol>
    <ul class="answered-dots" id="answered-dots"></ul>
  </section>

  <!-- Scoreboard -->
  <section id="v-scoreboard" class="view scoreboard" hidden>
    <h1 class="neon pink sb-title" id="sb-title"></h1>
    <ol class="sb-list" id="sb-list"></ol>
  </section>

  <!-- End: podium -->
  <section id="v-end" class="view end" hidden>
    <h1 class="neon end-title" data-i18n="screen.winner"></h1>
    <div class="podium" id="podium"></div>
    <ol class="rest" id="rest"></ol>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/screen.js"></script>
</body>
</html>
